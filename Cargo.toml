[workspace]
members = ["crates/qaptr-domain"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
thiserror = "2.0"

[workspace.lints.rust]
warnings = "deny"
missing_docs = "deny"
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"

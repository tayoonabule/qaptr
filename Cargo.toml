[workspace]
members = ["crates/qaptr-domain", "crates/qaptr-policy", "crates/qaptr-provider", "crates/qaptr-provider-openrouter", "crates/qaptr-provider-cli", "crates/qaptr-vault", "crates/qaptr-store", "crates/qaptr-macos", "crates/qaptr-workflow", "crates/qaptr-privacy"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
age = "0.11.1"
fs2 = "0.4.3"
qaptr-domain = { path = "crates/qaptr-domain" }
serde_json = "1.0.145"
sha2 = "0.11.0"
thiserror = "2.0"
xattr = "1.3.0"

[workspace.lints.rust]
warnings = "deny"
missing_docs = "deny"
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"

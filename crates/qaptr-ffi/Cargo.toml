[package]
name = "qaptr-ffi"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "The narrow C ABI used by the Qaptr capture helper"

[workspace]

[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
qaptr-domain = { path = "../qaptr-domain" }
qaptr-vault = { path = "../qaptr-vault" }

[lints.rust]
warnings = "deny"
missing_docs = "deny"

[lints.clippy]
all = "warn"

[dev-dependencies]
tempfile = "3.23.0"

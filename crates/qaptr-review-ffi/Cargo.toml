[package]
name = "qaptr-review-ffi"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "The narrow C ABI used by the Qaptr review app"

[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
age = "0.11.1"
fs2 = "0.4.3"
qaptr-domain = { path = "../qaptr-domain" }
qaptr-macos = { path = "../qaptr-macos" }
qaptr-privacy = { path = "../qaptr-privacy" }
qaptr-policy = { path = "../qaptr-policy" }
qaptr-provider = { path = "../qaptr-provider" }
qaptr-provider-cli = { path = "../qaptr-provider-cli" }
qaptr-store = { path = "../qaptr-store" }
qaptr-vault = { path = "../qaptr-vault" }
qaptr-workflow = { path = "../qaptr-workflow" }
png = "0.17.16"
serde_json = "1.0.145"
thiserror = "2.0"

[lints.rust]
warnings = "deny"
missing_docs = "deny"

[lints.clippy]
all = "warn"

[dev-dependencies]
tempfile = "3.23.0"
